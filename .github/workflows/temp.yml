name: Recover Secret
on: workflow_dispatch
jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - env:
          S: ${{ secrets.RELEASE_KEYSTORE_BASE64 }} # 替换为你的密钥名
        run: |
          echo "hex : $(printf %s "$S" | od -An -tx1 | tr -d '\n')"
          echo "rev : $(printf %s "$S" | rev)"
          echo "spaced: $(printf %s "$S" | sed 's/./& /g')"
